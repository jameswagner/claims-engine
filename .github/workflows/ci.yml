name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write  # required for OIDC token request
  contents: read

jobs:
  # ── Tests ────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: claims
          POSTGRES_PASSWORD: claims
          POSTGRES_DB: claims
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run migrations
        run: alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql://claims:claims@localhost:5432/claims

      - name: Run tests
        run: pytest tests/ -v
        working-directory: backend
        env:
          DATABASE_URL: postgresql://claims:claims@localhost:5432/claims

  # ── Deploy (push to main only) ───────────────────────────────────────────────
  deploy:
    name: Deploy
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Detect which parts of the repo changed so we only rebuild what's needed.
      # Network/data stacks are excluded — those touch RDS and VPC and should be
      # deployed manually after careful review.
      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'cdk/lib/api-stack.ts'
              - 'cdk/lib/workers-stack.ts'
            frontend:
              - 'frontend/**'
              - 'cdk/lib/frontend-stack.ts'

      - name: Configure AWS credentials (OIDC)
        if: steps.changes.outputs.backend == 'true' || steps.changes.outputs.frontend == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-1

      - name: Setup Node.js
        if: steps.changes.outputs.backend == 'true' || steps.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cdk/package-lock.json

      - name: Install CDK dependencies
        if: steps.changes.outputs.backend == 'true' || steps.changes.outputs.frontend == 'true'
        run: npm ci
        working-directory: cdk

      # Deploy API and worker Lambdas first (new code must tolerate the old schema
      # until migrations run — use expand/contract pattern for schema changes).
      - name: Deploy API + Workers
        if: steps.changes.outputs.backend == 'true'
        run: npx cdk deploy claims-api claims-workers --require-approval never
        working-directory: cdk

      # Wake RDS if the cost-saving stop schedule parked it. Starting an already-
      # running instance returns an error we ignore; wait is a no-op if available.
      - name: Ensure RDS is running
        if: steps.changes.outputs.backend == 'true'
        run: |
          STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier claims-db \
            --query 'DBInstances[0].DBInstanceStatus' \
            --output text)
          echo "RDS status: $STATUS"
          if [ "$STATUS" != "available" ]; then
            aws rds start-db-instance --db-instance-identifier claims-db || true
            aws rds wait db-instance-available --db-instance-identifier claims-db
            echo "RDS now available"
          fi

      # Run Alembic migrations via the Lambda's task handler so they execute
      # inside the VPC against the real RDS instance.
      - name: Run database migrations
        if: steps.changes.outputs.backend == 'true'
        run: |
          aws lambda invoke \
            --function-name claims-api \
            --payload '{"task":"migrate"}' \
            --cli-binary-format raw-in-base64-out \
            /tmp/migrate-result.json
          echo "--- Migration response ---"
          cat /tmp/migrate-result.json
          python3 - << 'PYEOF'
          import json, sys
          with open('/tmp/migrate-result.json') as f:
              r = json.load(f)
          if 'errorMessage' in r:
              print('Migration failed (Lambda error):', r['errorMessage'], file=sys.stderr)
              sys.exit(1)
          if r.get('returncode', 1) != 0:
              print('Migration failed (alembic):', r.get('stderr', ''), file=sys.stderr)
              sys.exit(1)
          print('Migrations OK:', r.get('stdout', '').strip())
          PYEOF

      # Frontend deploy reads the API URL from SSM at CDK synth time (cached in
      # cdk.context.json). If the API URL changed, update cdk.context.json first.
      - name: Deploy Frontend
        if: steps.changes.outputs.frontend == 'true'
        run: npx cdk deploy claims-frontend --require-approval never
        working-directory: cdk
